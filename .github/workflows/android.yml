name: Build PDF Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f PDFSaathiAndroid_v0.5.zip
          rm -rf PDFSaathiAndroid
          unzip -q PDFSaathiAndroid_v0.5.zip
          test -f PDFSaathiAndroid/app/build.gradle.kts
          test -f PDFSaathiAndroid/app/src/main/java/com/pdfsaathi/app/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Could not locate sdkmanager under $SDK_ROOT" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: PDFSaathiAndroid

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFSaathi-debug-apk
          path: PDFSaathiAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
