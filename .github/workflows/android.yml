name: Build PDF Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          if [ -f PDFSaathiAndroid.zip ] && [ ! -f PDFSaathiAndroid/app/build.gradle.kts ]; then
            unzip -q PDFSaathiAndroid.zip
          fi
          test -f PDFSaathiAndroid/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3 here because it tries to install
      # the obsolete SDK package named "tools", which now fails on some runners.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate Android sdkmanager" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: PDFSaathiAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFSaathi-debug-apk
          path: PDFSaathiAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
